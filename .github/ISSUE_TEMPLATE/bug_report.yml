name: Bug report
description: Report behavior with model, kernel and reproducible steps.
body:
  - type: input
    id: model
    attributes:
      label: Laptop model and kernel
      placeholder: Acer Nitro AN515-45, Linux 6.18.39-1-lts
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Sanitized diagnostic output
      description: Run nitro-sense --diagnose. Remove any information you do not want public. Do not include passwords or tokens.
      render: json
