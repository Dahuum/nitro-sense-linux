name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          NITRO_SENSE_ASSETS: none
      - run: python -m nitro_sense --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          NITRO_SENSE_ASSETS: none
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
